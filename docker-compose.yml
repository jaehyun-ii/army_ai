# ===============================================
# Army AI Platform - Development Docker Compose
# ===============================================
# Hot reload enabled for rapid development
# Usage: docker-compose -f docker-compose.dev.yml up
# ===============================================

services:
  # =====================
  # PostgreSQL Database
  # =====================
  postgres:
    image: postgres:15-alpine
    container_name: army_ai_postgres_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/complete_schema.sql:/schema/complete_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - army_ai_network_dev

  # =====================
  # Backend (FastAPI) - GPU Enabled
  # Development mode with code hot reload
  # =====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: army_ai_backend_dev
    container_name: army_ai_backend_dev
    restart: unless-stopped
    privileged: true  # Required for OverlayFS mount
    ipc: host  # Shared memory for PyTorch
    pid: host  # Access host processes for system monitoring
    ulimits:
      memlock: -1  # Unlimited memory locking
      stack: 67108864  # 64MB stack size
    env_file:
      - .env
    environment:
      # NVIDIA/CUDA
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # CARLA Backend
      CARLA_BACKEND_URL: http://${CARLA_BACKEND_HOST}:${CARLA_BACKEND_PORT}

      # Security
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}

      # Application
      APP_NAME: ${APP_NAME}
      DEBUG: "True"  # Development mode
      API_PREFIX: ${API_PREFIX}
      LOG_LEVEL: DEBUG  # More verbose logging
      ENVIRONMENT: development

      # Storage
      STORAGE_ROOT: /storage
      STORAGE_TYPE: ${STORAGE_TYPE}

      # PyTorch/CUDA - GPU 0,1 for adversarial attacks (but can see all GPUs for monitoring)
      CUDA_VISIBLE_DEVICES: "0,1"

      # System monitoring - use host /proc for accurate stats
      PROCFS_PATH: /host/proc
      CGROUPFS_PATH: /host/sys/fs/cgroup

    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      # OverlayFS layers
      - ./storage_init:/storage_init:ro   # Lower layer (읽기 전용 초기 데이터)
      - ./storage:/storage_rw:rw          # Upper/Work layer (호스트 ./storage에 저장)
      # /storage는 entrypoint에서 OverlayFS로 마운트됨

      - ./backups:/backups:rw
      - backend_logs_dev:/app/logs
      # Hot reload: mount source code (uncomment if backend supports hot reload)
      - ./backend:/app:rw
      # Entrypoint script (for hot reload without rebuild)
      - ./backend/entrypoint.sh:/entrypoint.sh:ro
      # Host system monitoring - required for accurate CPU/memory stats
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    devices:
      # Camera devices access
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
    entrypoint: ["/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - army_ai_network_dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # =====================
  # Frontend (Next.js) - Development Mode
  # Hot reload enabled with volume mounts
  # =====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NODE_ENV: development
    image: army_ai_frontend_dev
    container_name: army_ai_frontend_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Database (내부 통신용)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${INTERNAL_POSTGRES_URL}/${POSTGRES_DB}?schema=public

      # Auth
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: development  # Development mode

      # API URLs (브라우저에서 접속 - 클라이언트사이드)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_API_URL}

      # Backend URL (서버사이드 API 라우트 통신용)
      BACKEND_API_URL: ${INTERNAL_BACKEND_URL}
      BACKEND_URL: ${INTERNAL_BACKEND_URL}
      CARLA_BACKEND_URL: http://${CARLA_BACKEND_HOST}:${CARLA_BACKEND_PORT}

      # Storage
      STORAGE_ROOT: /storage

      # Next.js Dev Server
      WATCHPACK_POLLING: "true"  # Enable file watching in Docker
      CHOKIDAR_USEPOLLING: "true"  # Fallback file watching

    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      # Hot reload: mount source code
      - ./frontend:/app:rw
      # Use named volume for node_modules to improve performance
      - frontend_node_modules:/app/node_modules
      # Persistent volumes
      - frontend_uploads_dev:/app/uploads
      - frontend_logs_dev:/app/logs
      # Cache for Next.js
      - frontend_next_cache:/app/.next
      # NOTE: Storage access is handled via backend API proxy (/api/storage -> /api/v1/storage)
      # Direct storage mount is NOT needed
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - army_ai_network_dev
    command: npm run dev

  # =====================
  # CARLA Simulator
  # GPU Device 3 (dedicated)
  # =====================
  carla_simulator:
    image: army_ai_sim:0.0.3
    container_name: army_ai_sim_dev
    restart: unless-stopped
    user: root  # Run as root to fix volume permissions, then switch to carla
    tty: true
    stdin_open: true
    privileged: true  # Required for OverlayFS mount (already enabled)
    shm_size: "8g"
    mem_limit: 16g
    environment:
      - NVIDIA_VISIBLE_DEVICES=3
      - NVIDIA_DRIVER_CAPABILITIES=all
    ports:
      - "${CARLA_SIMULATOR_RPC_PORT}:2000"  # CARLA RPC port
      - "${CARLA_SIMULATOR_STREAMING_PORT1}:2001"  # CARLA streaming port 1
      - "${CARLA_SIMULATOR_STREAMING_PORT2}:2002"  # CARLA streaming port 2
    volumes:
      # OverlayFS layers for Vehicles
      - ./storage_init/simulator:/storage_init:ro  # Lower layer (읽기 전용 초기 차량)
      - ./storage/simulator:/storage_rw:rw         # Upper/Work layer (호스트 ./storage/simulator에 저장)
      # CARLA_VEHICLES_PATH는 entrypoint에서 OverlayFS로 마운트됨

      - ./carla_simulator_entrypoint.sh:/entrypoint.sh:ro
    networks:
      - army_ai_network_dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['3']
              capabilities: [gpu]
    entrypoint: ["/entrypoint.sh"]
    command: >
      -RenderOffScreen
      -nosound
      -vulkan
      -carla-rpc-port=2000
      -carla-streaming-port=0
      -quality-level=low

  # =====================
  # CARLA Client Backend
  # GPU Device 2 (dedicated)
  # =====================
  carla_client_backend:
    image: army_carla_client_backend:0.0.2
    container_name: army_ai_carla_backend_dev
    restart: unless-stopped
    privileged: true  # Required for OverlayFS mount
    tty: true
    stdin_open: true
    shm_size: "16g"
    ulimits:
      memlock: -1  # Unlimited memory locking
      stack: 67108864  # 64MB stack size
    working_dir: /workspace
    environment:
      - NVIDIA_VISIBLE_DEVICES=2
      - NVIDIA_DRIVER_CAPABILITIES=all
    ports:
      - "${CARLA_CLIENT_BACKEND_JUPYTER_PORT}:8888"  # Jupyter/API port
      - "${CARLA_CLIENT_BACKEND_SERVICE_PORT}:1455"  # Additional service port
    volumes:
      # OverlayFS layers
      - ./storage_init/3d:/storage_init:ro   # Lower layer (읽기 전용 초기 데이터)
      - ./storage/3d:/storage_rw:rw          # Upper/Work layer (호스트 ./storage/3d에 저장)
      # /storage_merged는 entrypoint에서 OverlayFS로 마운트되고
      # /workspace는 /storage_merged로 symlink됨

      - ./carla_client_entrypoint.sh:/entrypoint.sh:ro
    networks:
      - army_ai_network_dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
    depends_on:
      - carla_simulator
    entrypoint: ["/entrypoint.sh"]
    command: python /workspace/main.py --port 8888 --host 0.0.0.0 --carla_host carla_simulator --carla_port 2000

# =====================
# Networks
# =====================
networks:
  army_ai_network_dev:
    driver: bridge
    name: army_ai_network_dev

# =====================
# Volumes
# =====================
volumes:
  postgres_data_dev:
    driver: local
    name: army_ai_postgres_data_dev

  backend_logs_dev:
    driver: local
    name: army_ai_backend_logs_dev

  frontend_node_modules:
    driver: local
    name: army_ai_frontend_node_modules

  frontend_uploads_dev:
    driver: local
    name: army_ai_frontend_uploads_dev

  frontend_logs_dev:
    driver: local
    name: army_ai_frontend_logs_dev

  frontend_next_cache:
    driver: local
    name: army_ai_frontend_next_cache 
